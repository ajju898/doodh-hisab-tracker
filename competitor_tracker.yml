name: Doodh Ka Hisab Daily Competitor Radar

on:
  schedule:
    # Runs daily at 03:00 UTC (08:30 AM IST)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual run button from GitHub Actions UI

permissions:
  contents: write

jobs:
  track-competitors:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-play-scraper requests python-dotenv

      - name: 🚀 Run Competitor Tracking Cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILY_NEW_APPS_LIMIT: 10
        run: |
          python dairy_tracker.py --run

      - name: 📑 Generate GitHub Markdown (apps/ and changes/)
        run: |
          python github_generator.py

      - name: 💾 Commit and Push Changes to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "📊 Automated Daily Update: Tracked competitors, updates, and reviews [skip ci]"
          git push
